name: security.txt expiry check

# Opens an issue when .well-known/security.txt is within 60 days of its Expires date,
# so the file never silently goes stale (RFC 9116 requires a future Expires).
on:
  schedule:
    - cron: '0 9 1 * *'   # 09:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Expires date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expires=$(grep -i '^Expires:' .well-known/security.txt | cut -d' ' -f2)
          days=$(( ( $(date -d "$expires" +%s) - $(date +%s) ) / 86400 ))
          echo "security.txt expires $expires ($days days left)"
          if [ "$days" -le 60 ]; then
            title="security.txt expires in $days days"
            if ! gh issue list --state open --search "in:title security.txt expires" --json number --jq '.[0].number' | grep -q .; then
              gh issue create --title "$title" --body "Update the Expires line in .well-known/security.txt (currently $expires) to a date less than a year ahead, then push."
            fi
          fi
