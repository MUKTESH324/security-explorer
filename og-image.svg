      <path d="M1080 372 1062 379v13c0 12 7 20 18 25 11-5 18-13 18-25v-13z" fill="none" stroke="#45c97a" stroke-width="3" stroke-linejoin="round"/>
      <path d="m1071 393 6 6 11-12" fill="none" stroke="#45c97a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1080" y="472">Defense</text>
    </g>
    <circle cx="980" cy="220" r="18" fill="#ff6b6b" fill-opacity="0.25"/>
    <circle cx="980" cy="220" r="9" fill="#ff6b6b"/>
