<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.07"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0c0d10"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#4c8dff"/>

  <!-- logo -->
  <g transform="translate(80 92) scale(1.6)" fill="none" stroke="#4c8dff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 6 13 13v15c0 13 8 22.5 19 27.5C43 50.5 51 41 51 28V13z" stroke-width="4.5"/>
    <path d="M23 42 32 18 41 42M26.5 33.5h11" stroke-width="4"/>
    <g fill="#4c8dff" stroke="none"><circle cx="32" cy="18" r="4.2"/><circle cx="23" cy="42" r="4.2"/><circle cx="41" cy="42" r="4.2"/></g>
  </g>
  <text x="196" y="160" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#e7e9ed">Security Explorer</text>

  <text x="80" y="292" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Security concepts,</text>
  <text x="80" y="370" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1.5">one packet at a time.</text>
  <text x="80" y="434" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#9ba1ac">Free, step-by-step walkthroughs of attacks,</text>
  <text x="80" y="470" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#9ba1ac">protocols and defenses.</text>
  <text x="80" y="560" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#4c8dff">securityexplorer.org</text>

  <!-- mini network diagram -->
