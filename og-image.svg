    <line x1="880" y1="270" x2="1080" y2="170" stroke="#4c8dff" stroke-width="3" stroke-dasharray="6 9"/>
    <line x1="880" y1="270" x2="1080" y2="400" stroke="#343842" stroke-width="3" stroke-dasharray="6 9"/>
    <line x1="1080" y1="170" x2="1080" y2="400" stroke="#343842" stroke-width="3" stroke-dasharray="6 9"/>
    <g>
      <rect x="836" y="226" width="88" height="88" rx="18" fill="#16181d" stroke="#ff6b6b" stroke-width="3"/>
      <path d="M880 244c-11 0-17 9-17 19v7l-5 19h44l-5-19v-7c0-10-6-19-17-19z M870 266c4-4 16-4 20 0v6c-4 4-16 4-20 0z" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-linejoin="round"/>
      <text x="880" y="342">Attacker</text>
    </g>
    <g>
      <rect x="1036" y="126" width="88" height="88" rx="18" fill="#16181d" stroke="#4c8dff" stroke-width="3"/>
      <g fill="none" stroke="#b7bdc8" stroke-width="3"><rect x="1062" y="146" width="36" height="13" rx="3"/><rect x="1062" y="163" width="36" height="13" rx="3"/><rect x="1062" y="180" width="36" height="13" rx="3"/></g>
      <text x="1080" y="242">Web App</text>
    </g>
    <g>
